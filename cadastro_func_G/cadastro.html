<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="cadastro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Cadastro</title>
</head>

<body>
    <main>
        <div class="cadastro">
            <form onsubmit="handleLogin(event)" class="cadastro1" id="loginForm" action="#" method="post" novalidate>
                <h1 class="titulo">Cadastro de Funcionário</h1>

                <fieldset>

                    <div class="secao">
                        <div class="secao-lado-esquerdo">
                            <p class="secao-titulo">Dados Pessoais</p>
                        </div>

                        <div class="secao-lado-direito">
                            <div class="grid">
                                <div class="campo full">
                                    <label for="nomecompleto">Nome Completo:</label>
                                    <input type="text" id="nomecompleto" name="nomecompleto"
                                        placeholder="Insira o nome completo" inputmode="text" autocomplete="off"
                                        required>
                                </div>

                                <div class="campo">
                                    <label for="re">RE (Registro do Empregado):</label>
                                    <input type="text" id="re" name="re" placeholder="Digite o RE" inputmode="numeric"
                                        pattern="[0-9]*" autocomplete="off" maxlength="6" required>
                                </div>

                                <div class="campo">
                                    <label for="cpf">CPF:</label>
                                    <input type="text" maxlength="14" name="cpf" id="cpf" placeholder="000.000.000-00"
                                        autocomplete="off" inputmode="numeric" pattern="[0-9]* >
                                </div>

                                <div class=" campo">
                                    <label for="dataNascimento">Data de Nascimento:</label>
                                    <input type="date" name="dataNascimento" id="dataNascimento" min="01-01-1900"
                                        max="31-12-2023" required>
                                </div>

                                <div class="campo">
                                    <label for="telefone">Telefone:</label>
                                    <input type="tel" name="telefone" id="telefone" inputmode="numeric" maxlength=""
                                        autocomplete="off" placeholder="(11) 99999-9999"
                                        pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
                                </div>

                                <div class="campo full">
                                    <label for="email">E-mail:</label>
                                    <input type="text" name="email" id="email" placeholder="Digite o E-mail">
                                </div>

                                <div class="campo full">
                                    <label for="endereco">Endereço:</label>
                                    <input type="text" name="endereco" id="endereco" placeholder="Rua, número, bairro">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="secao">
                        <div class="secao-lado-esquerdo">
                            <p class="secao-titulo">Acesso</p>
                        </div>

                        <div class="secao-lado-direito">
                            <div class="grid">
                                <div class="campo full">
                                    <label for="setor">Setor:</label>
                                    <select name="setor_usuario" id="setor" required>
                                        <option value="">Selecione o Setor</option>
                                        <option value="Administração">Administração</option>
                                        <option value="Produção">Produção</option>
                                    </select>
                                </div>

                                <div class="campo senha-wrap">
                                    <label for="senha">Criar Senha:</label>
                                    <input type="password" id="senha" name="senha" placeholder="Digite a senha"
                                        autocomplete="off" maxlength="11" required>

                                    <button type="button" class="toggle-senha" aria-label="Mostrar senha">

                                        <svg class="icone-olho olho-fechado" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M3 3L21 21" />
                                            <path
                                                d="M10.58 10.58C10.21 10.95 10 11.45 10 12C10 13.1 10.9 14 12 14C12.55 14 13.05 13.79 13.42 13.42" />
                                            <path
                                                d="M9.88 4.24C10.55 4.08 11.26 4 12 4C17 4 20.73 7.11 22 12C21.62 13.47 20.87 14.81 19.84 15.91M14.12 19.76C13.45 19.92 12.74 20 12 20C7 20 3.27 16.89 2 12C2.6 9.67 4.06 7.7 6.11 6.39" />
                                        </svg>

                                        <svg class="icone-olho olho-aberto" viewBox="0 0 24 24" aria-hidden="true">
                                            <path
                                                d="M2 12C3.27 7.11 7 4 12 4C17 4 20.73 7.11 22 12C20.73 16.89 17 20 12 20C7 20 3.27 16.89 2 12Z" />
                                            <path
                                                d="M12 15.5C10.07 15.5 8.5 13.93 8.5 12C8.5 10.07 10.07 8.5 12 8.5C13.93 8.5 15.5 10.07 15.5 12C15.5 13.93 13.93 15.5 12 15.5Z" />
                                        </svg>
                                    </button>
                                </div>

                                <div class="campo">
                                    <p class="label-like">Status:</p>
                                    <div class="status-toggle">
                                        <input onclick="selecionarModo('ativo')" class="bt-ativ" type="radio" id="ativo"
                                            name="status" value="ativo" checked>
                                        <label class="bt-inativ" for="ativo">Ativo</label>

                                        <input onclick="selecionarModo ('inativo')" type="radio" id="inativo"
                                            name="status" value="inativo">
                                        <label for="inativo">Inativo</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </fieldset>

                <div class="botao1_2">
                    <button type="button" class="btn-sec" onclick="selecionarModo('cancelar')">Cancelar</button>
                    <button type="button" class="btn-prim" onclick="selecionarModo ('enviar')">Enviar</button>
                </div>

            </form>
        </div>
    </main>

    <script>
        const reInput = document.getElementById("re");

        reInput.addEventListener("input", function () {

            // remove tudo que não é número
            this.value = this.value.replace(/\D/g, "");

            // limita a 6 números
            if (this.value.length > 6) {
                this.value = this.value.slice(0, 6);
            }
        });

        const senhaInput = document.getElementById("senha");
        const btnToggle = document.querySelector(".toggle-senha");
        const olhoFechado = document.querySelector(".olho-fechado");
        const olhoAberto = document.querySelector(".olho-aberto");

        btnToggle.addEventListener("click", () => {

            const estaVisivel = senhaInput.type === "text";

            senhaInput.type = estaVisivel ? "password" : "text";

            // troca os ícones
            olhoFechado.style.display = estaVisivel ? "block" : "none";
            olhoAberto.style.display = estaVisivel ? "none" : "block";

            // acessibilidade (texto do botão)
            btnToggle.setAttribute("aria-label", estaVisivel ? "Mostrar senha" : "Ocultar senha");
        });

        function handleLogin(event) {
            event.preventDefault();

            const re = document.getElementById("re").value.trim();
            const senha = document.getElementById("senha").value.trim();
            const erro = document.getElementById("loginErro");

            // limpa erro anterior
            erro.textContent = "";

            // erro de preenchimento (front-end)
            if (re === "") {
                erro.textContent = "Digite o RE.";
                return;
            }

            if (re.length !== 6) {
                erro.textContent = "O RE deve ter 6 números.";
                return;
            }

            if (senha === "") {
                erro.textContent = "Digite a senha.";
                return;
            }
        }


        const botoes = document.querySelectorAll(".status-toggle");

        botoes.forEach(function (botao) {

            botao.addEventListener("click", function () {

                botoes.forEach(function (b) {
                    b.classList.remove("active");
                });

                botao.classList.add("active");

            });

        });


        // define modo padrão como colaborador
        let modoSelecionado = "ativo";


        function selecionarModo(modo) {

            modoSelecionado = modo;

            const botaoColab = document.querySelector(".bt-ativ");
            const botaoAdm = document.querySelector(".bt-inativ");

            botaoColab.classList.remove("is-active");
            botaoAdm.classList.remove("is-active");

            if (modo === "ativo") {
                botaoColab.classList.add("is-active");
            } else {
                botaoAdm.classList.add("is-active");
            }
        }





        const botoesAcoes = document.querySelectorAll(".botao1_2 button ");

        botoesAcoes.forEach(function (botao) {

            botao.addEventListener("click", function () {

                botoesAcoes.forEach(function (b) {
                    b.classList.remove("active");
                });

                botao.classList.add("active");

            });

        });


        // define modo padrão como colaborador
        let modoSelecionado2 = "btn-prim";


        function selecionarAcao(modo) {

            modoSelecionado2 = modo;

            const botaoEnviar = document.querySelector(".btn-prim");
            const botaoCancelar = document.querySelector(".btn-sec");

            botaoEnviar.classList.remove("is-active");
            botaoCancelar.classList.remove("is-active");

            if (modo === "btn-prim") {
                botaoEnviar.classList.add("is-active");
            } else {
                botaoCancelar.classList.add("is-active");
            }
        }



    </script>
</body>

</html>
