<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style-padrao.css">
    <link rel="stylesheet" href="../style/style-pedido.css">
    <link rel="stylesheet" href="../style/style-responsivo.css">
    <title>Pedidos</title>
</head>

<script src="../script/script.js"></script>

<body>

    <div class="sidebar">
        <div class="logo-sidebar">
            <img class="logo" src="../imgs/logo.png" alt="">
            <img class="logo-nome" src="../imgs/E-threads.png" alt="">
        </div>
        <hr>

        <div class="menu">
            <button>
                <a href="inicio.html">Início</a>
            </button>
            <hr>
            <button>
                <a href="pedidos.html">Pedidos</a>
            </button>
            <hr>
            <button>
                <a href="estoque.html">Estoque</a>
            </button>
            <hr>
            <button>
                <a href="clientes.html">Clientes</a>
            </button>
            <hr>
            <button>
                <a href="funcionario.html">Funcionários</a>
            </button>
            <hr>
            <button>
                <a href="relatorio.html">Relatórios</a>
            </button>
            <hr>
        </div>

        <div class="footer">
            
        </div>
    </div>


    <div class="container">

        <div class="top">

            <div class="top-left">
                <input class="search" placeholder="Pesquisar pedido">

            </div>

            <div class="top-right">

                <select class="btn btn-filter">
                    <option value="">Filtro</option>
                    <option value="">Pendentes</option>
                    <option value="">Finalizados</option>
                    <option value="">Cancelados</option>
                </select>

                <button class="btn btn-add">+ Pedido</button>

                <div class="profile"></div>

            </div>

        </div>

        <div class="list">


            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('recentes')">
                    Pedidos Recentes
                </button>

                <button class="tab-btn" onclick="openTab('historico')">
                    Histórico de Pedidos
                </button>
            </div>


            <div id="recentes" class="tab-content active">
                <!-- seus pedidos recentes -->

                <div class="product">

                    <div class="product-left">
                        <div class="img"></div>
                        <div class="produto">
                            <span>Produto </span>
                            <p>#1023</p>
                        </div>

                        <div class="empresa">
                            <span>Empresa</span>
                            <p>Empresa X</p>
                        </div>

                        <div class="status">
                            <span>Status</span>
                            <p>Pendente</p>
                        </div>
                    </div>

                    <div class="actions">
                        ✏️
                        🗑️
                    </div>

                </div>

            </div>



            <div id="historico" class="tab-content">
                <!-- pedidos antigos -->

                <div class="product">

                    <div class="product-left">
                        <div class="img"></div>
                        <div class="produto">
                            <span>Produto </span>
                            <p>#1023</p>
                        </div>

                        <div class="empresa">
                            <span>Empresa</span>
                            <p>Empresa X</p>
                        </div>

                        <div class="status">
                            <span>Status</span>
                            <p>Pronto</p>
                        </div>
                    </div>

                    <div class="actions">
                        ✏️
                        🗑️
                    </div>

                </div>
            </div>
        </div>

    </div>

</body>

</html>
