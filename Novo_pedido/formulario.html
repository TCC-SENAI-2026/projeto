<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formulario.css">
    <title>Formulario</title>
</head>

<body>

<header>

    <img class="logo" src="img/E-threads (3) (1).png" alt="logo">

    <nav>
        <ul>
            <li><a>Inicio</a></li>
            <li><a>Clientes</a></li>
            <li><a>Estoque</a></li>
            <li>
                <a>Pedidos</a>
                <ul class="submenu">
                    <li><a>Historico de Pedidos</a></li>
                    <li><a>Novo Pedido</a></li>
                    <li><a>Sair</a></li>
                </ul>
            </li>
            <li><a>Relatorios</a></li>
        </ul>
    </nav>

    <div class="conta">
        <p class="ola-nome">Olá, nome</p>
    </div>

</header>

<main>

    <!-- ✅ STEPPER (BARRA DE PROGRESSO MANTIDA) -->
    <div class="stepper-wrapper">
        <div class="stepper-item completed">
            <div class="step-counter">1</div>
            <div class="step-name">Identificação</div>
        </div>
        <div class="stepper-item completed">
            <div class="step-counter">2</div>
            <div class="step-name">Produtos</div>
        </div>
        <div class="stepper-item active">
            <div class="step-counter">3</div>
            <div class="step-name">Finalização</div>
        </div>
    </div>

    <form id="meuFormulario">

        <div class="container1">

            <h1>Formulário com Informações do Pedido</h1>

            <!-- CLIENTE -->
            <h2>Dados do Cliente</h2>

            <div class="D-client1">
                <div class="campo1">
                    <label for="nomeCliente"><strong>Nome:</strong></label>
                    <input type="text" id="nomeCliente" required placeholder="Nome do cliente">
                </div>

                <div class="campo1">
                    <label for="dataPedido"><strong>Data do Pedido:</strong></label>
                    <input type="date" id="dataPedido" required>
                </div>
            </div>

            <div class="D-client2">
                <div class="campo2">
                    <label for="telefoneCliente"><strong>Contato:</strong></label>
                    <input type="tel" id="telefoneCliente" required placeholder="(11) 99999-9999">
                </div>

                <div class="campo2">
                    <label for="emailCliente"><strong>Email:</strong></label>
                    <input type="email" id="emailCliente" required placeholder="exemplo@dominio.com">
                </div>
            </div>

            <!-- LOGISTICA -->
            <h2>Detalhes Logísticos</h2>

            <div class="D-logistic">

                <div class="campo3">
                    <label for="prazoEntrega"><strong>Prazo de Entrega:</strong></label>
                    <input type="date" id="prazoEntrega" required>
                </div>

                <!-- ✅ PRIORIDADE CORRIGIDA -->
                <div class="container-prioridade">

                    <p><strong>Prioridade:</strong></p>

                    <div class="niveis">

                        <label>
                            <input type="radio" name="pedido_prioridade" value="baixa" required>
                            Baixa
                        </label>

                        <label>
                            <input type="radio" name="pedido_prioridade" value="media">
                            Média
                        </label>

                        <label>
                            <input type="radio" name="pedido_prioridade" value="alta">
                            Alta
                        </label>

                    </div>

                </div>

            </div>

            <!-- PERSONALIZAÇÃO -->
            <h2>Personalização</h2>

            <div class="D-personalizacao">

                <div class="campo">
                    <label for="localPersonalizacao"><strong>Local da personalização:</strong></label>

                    <select id="localPersonalizacao" required>
                        <option value="">Selecione</option>
                        <option value="Frente">Frente</option>
                        <option value="Costas">Costas</option>
                        <option value="Manga direita">Manga direita</option>
                        <option value="Manga esquerda">Manga esquerda</option>
                        <option value="Peito">Peito</option>
                        <option value="Gola">Gola</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="obsPersonalizacao"><strong>Observação:</strong></label>
                    <input type="text" id="obsPersonalizacao" placeholder="Opcional">
                </div>

            </div>

            <!-- OBS -->
            <h2>Observação do Pedido</h2>

            <div class="campo">
                <textarea id="obsGeralPedido" placeholder="Detalhes adicionais..."></textarea>
            </div>

            <button type="submit" class="proxima" id="btnContinuar">
                <strong>Continuar</strong>
            </button>

        </div>

    </form>

</main>

<script src="js/formulario.js"></script>

</body>
</html>
