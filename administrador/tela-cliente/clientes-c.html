<!DOCTYPE html>
<html lang="UTF-8">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style-padrao.css">
    <link rel="stylesheet" href="../tela-cliente/style-clientes.css">
    <title>Document</title>
</head>

<body>
    <header>
        <img class="logo" src="../../imagens-inicio-administrador/E-threads-branco.png" alt="logo">
        <nav>
            <ul>
                <li><a href="../tela-inicio/inicio-c.html">Inicio</a></li>
                <li><a href="clientes-c.html">Clientes</a></li>
                <li><a>Estoque</a></li>
                <li><a href="../tela-pedidos/pedidos-c.html" 
                    onmouseover="menuPedidos()">Pedidos</a>
                    <ul class="submenu">
                        <li><a>Historico de Pedidos</a></li>
                        <li><a>Novo Pedido</a></li>
                        <li><a>.</a></li>
                    </ul>
                </li>
                <li><a>Relatorios</a></li>
            </ul>
        </nav>


        <div onclick="loginMenu()" class="conta">
            <img class="icone-login" src="../../imagens-inicio-administrador/loginicon.svg" alt="icone-login">
            <p>Ola, nome</p>
            <img class="arrow-drop" src="../../imagens-inicio-administrador/arrowdrop.svg" alt="arrow drop">
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Clientes</h1>

            <div class="filtro">
                <input type="text" placeholder="Digite o nome do cliente">
                <select name="filtro" id="filtro" required>
                    <option value="todos">Todos</option>
                    <option value="ativos">Ativos</option>
                    <option value="inativos">Inativos</option>
                    <option value="crescente">A - Z</option>
                    <option value="decrescente">Z - A</option>
                </select>
            </div>
        </div>

        <hr>

        <div class="clientes">

            <div onclick="openModal()" class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 1</h3>
                    <div id="resetModal" class="modal" style="display:none;">
                        <!-- id="resetModal" o JS usa isso para encontrar o modal, class="modal" o css estiliza esse fundo, style="display:none" o modal começa escondido até alguem clicar-->

                        <div class="modal-content">
                            <!-- caixa branca do centro, tudo que o usuário ve, fica aqui dentro -->
                            <div class="modal-header"> <!-- titulo do modal -->
                                <h2>Redefinir Senha</h2>
                                <button class="close" aria-label="Fechar" type="button"
                                    onclick="closeModal()">×</button>
                                <!-- botão de fechar, ao clicar no "x" o modal desaparece -->
                            </div>

                            <hr class="linha-personalizada">

                            <form class="modal-body" onsubmit="enviarSolicitacao(event)"> <!-- Corpo do modal -->
                                <label for="reReset"></label>
                                <input type="text" id="reReset" placeholder="Digite seu RE" inputmode="numeric"
                                    pattern="[0-9]*" autocomplete="off" maxlength="6" required />

                                <!-- id="reReset" identifica o campo, placeholder -> texto de ajuda -->

                                <button type="submit" onclick="enviarSolicitacao()">Enviar</button>
                                <!-- Quando clica, chama a função enviarSolicitacao() -->

                                <p class="modal-help">Sua solicitação será enviada ao administrador.</p>
                                <!-- Texto informativo -->
                            </form>
                        </div>
                    </div>
                    <div class="status"></div>
                </div>
            </div>
            <div class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 2</h3>
                    <div class="status"></div>
                </div>
            </div>
            <div class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 3</h3>
                </div>
            </div>
            <div class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 4</h3>
                </div>
            </div>
            <div class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 5</h3>
                </div>
            </div>
            <div class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 6</h3>
                    <div class="status"></div>
                </div>
            </div>
            <div class="card">
                <img src="../../imagens-clientes-administrador/7455353.jpg" alt="">
                <div class="nome-cliente">
                    <h3>Cliente 7</h3>
                </div>
            </div>
        </div>

    </main>

    <script>
         function openModal() {
            document.getElementById("resetModal").style.display = "flex";
        }

        // Procura o elemento com id "resetModal", muda o display para "none", fazendo o modal desaparecer
        function closeModal() {
            document.getElementById("resetModal").style.display = "none";
        }

        // Mostra um alerta e fecha o modal
        function enviarSolicitacao(event) {
            event.preventDefault();

            const re = document.getElementById("reReset").value.trim();

            if (re === "") {
                return;
            }

            alert("Solicitação enviada com sucesso.");
            closeModal();
        }

          // bloqueia letras no campo RE do modal
        const reResetInput = document.getElementById("reReset");

        reResetInput.addEventListener("input", function () {
            // remove tudo que não é número
            this.value = this.value.replace(/\D/g, "");

            // limita a 6 números
            if (this.value.length > 6) {
                this.value = this.value.slice(0, 6);
            }
        });


        /* window: pagina inteira, click: evento de clique, function (e): função que recebe o evento (informação do clique) */
        window.addEventListener("click", function (e) {

            // Guarda a variável modal, que recebe o elemento com id "resetModal" (que cobre a tela toda)
            const modal = document.getElementById("resetModal");

            // Se o clique (e.target) for igual ao modal (ou seja, se o clique foi fora da caixa branca) closeModal() (entao fecha o modal)
            if (e.target === modal) closeModal();
        });


    </script>

    <footer>
        <h4>Desenvolvido por </h4>
    </footer>
</body>

</html>
