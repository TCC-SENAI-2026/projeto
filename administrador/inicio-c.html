<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-inicio-administrador.css" type="text/css">
    <title>Document</title>
</head>

<body>
    <header>
        <h4>Inicio</h4>
        <h4>Clientes</h4>
        <h4>Estoque</h4>
        <h4>Pedidos</h4>
        <h4>Relatorios</h4>
        <div class="conta">
            <img class="icone-login" 
            src="../imagens-inicio-administrador/loginicon.svg"
            alt="icone-login">
            <p>Ola, nome</p>
            <img class="arrow-drop" 
            src="../imagens-inicio-administrador/arrowdrop.svg" 
            alt="arrow drop">
        </div>
    </header>
    
    <main>
        <section class="indicadores">
            <div class="p-pendente">
                <h1>Pecas em Producao</h1>

                <div class="info">
                    <img class="img-indicador" 
                    src="../imagens-inicio-administrador/camiseta-icone.svg" 
                    alt="icone camiseta">
                    <h2>210</h2>
                </div>
            </div>

            <div class="p-pronto">
                <h1>Pecas Prontas</h1>

                <div class="info">
                    <img class="img-indicador" 
                    src="../imagens-inicio-administrador/caminhao-icone.svg" 
                    alt="icone caminhão">
                    <h2>150</h2>
                </div>
            </div>
        </section>
       

        <section class="conteudo">
            <div class="container-esquerda">
            
                <div class="estoque-produto">
                    <h2>Estoque de Produtos</h2>
                    <hr>

                </div>

                <div class="estoque-material">
                    <h2>Estoque de Materiais</h2>
                    <hr>
                    
                </div>

            </div>

            
            <div class="container-direita">
                <h2>Pedidos Recentes</h2>
                <hr>
            </div>
        </section>
    </main>
</body>

</html>
