<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="form_cliente.css" />
    <link rel="stylesheet" href="../CSS_padrao/responsivo.css" />
    <title>Cadastro de Cliente</title>
</head>

<body>
    <main>
        <div class="cadastro">
            <form class="cadastro1" autocomplete="off">
                <h1 class="titulo">Cadastro de Cliente</h1>

                <fieldset>

                    <div class="secao">
                        <div class="secao-lado-esquerdo">
                            <p class="secao-titulo">Dados da Empresa</p>
                        </div>

                        <div class="secao-lado-direito">
                            <div class="grid">
                                <div class="campo full">
                                    <label for="nome_empresa">Empresa:</label>
                                    <input type="text" id="nome_empresa" name="nome_empresa"
                                        placeholder="Ex: Caio Induscar" required autocomplete="off">
                                </div>

                                <div class="campo full">
                                    <label for="nome_responsavel">Responsável:</label>
                                    <input type="text" maxlength="80" name="nome_responsavel" id="nome_responsavel"
                                        placeholder="Ex: João Silva (RH)" autocomplete="off">
                                </div>

                                <div class="campo">
                                    <label for="cnpj">CNPJ:</label>
                                    <input type="text" maxlength="18" name="cnpj" id="cnpj"
                                        placeholder="00.000.000/0000-00" autocomplete="off">
                                </div>

                                <div class="campo">
                                    <label for="telefone">Telefone:</label>
                                    <input type="tel" name="telefone" id="telefone" placeholder="(11) 99999-9999"
                                        autocomplete="off">
                                </div>

                                <div class="campo full">
                                    <label for="email">E-mail:</label>
                                    <input type="email" name="email" id="email" placeholder="contato@empresa.com"
                                        autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="secao">
                        <div class="secao-lado-esquerdo">
                            <p class="secao-titulo">Endereço</p>
                        </div>

                        <div class="secao-lado-direito">
                            <div class="grid">

                                <div class="campo">
                                    <label for="cep">CEP:</label>
                                    <input type="text" name="cep" id="cep" placeholder="00000-000"
                                        autocomplete="off">
                                </div>

                                <div class="campo">
                                    <label for="cidade">Cidade:</label>
                                    <input type="text" name="cidade" id="cidade" placeholder="Ex: São Paulo"
                                        autocomplete="off">
                                </div>

                                <div class="campo full">
                                    <label for="rua">Rua:</label>
                                    <input type="text" name="rua" id="rua" placeholder="Ex: Rua das Flores, 123"
                                        autocomplete="off">
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="secao">
                        <div class="secao-lado-esquerdo">
                            <p class="secao-titulo">Informações Adicionais</p>
                        </div>

                        <div class="secao-lado-direito">
                            <div class="grid">

                                <div class="campo full">
                                    <label for="observacoes">Observações:</label>
                                    <textarea id="observacoes"
                                        placeholder="Ex: Cliente prefere contato por e-mail"></textarea>
                                </div>

                                <div class="campo">
                                    <p class="label-like">Status:</p>
                                    <div class="status-toggle">
                                        <input type="radio" id="ativo" name="status" value="ativo" checked>
                                        <label for="ativo">Ativo</label>

                                        <input type="radio" id="inativo" name="status" value="inativo">
                                        <label for="inativo">Inativo</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </fieldset>

                <div class="botao1_2">
                    <button type="button" class="btn-sec" onclick="window.location.href='cliente.html'">Cancelar</button>
                    <button type="submit" class="btn-prim">Salvar</button>
                </div>

            </form>
        </div>
    </main>
</body>

</html>
