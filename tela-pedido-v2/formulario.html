<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="-style2.css">
    <title>Ficha Técnica</title>
</head>

<body>
    <header>

        <img class="logo" src="img/E-threads (3) (1).png" alt="logo">
        <nav>
            <ul>
                <li><a>Inicio</a></li>
                <li><a>Clientes</a></li>
                <li><a>Estoque</a></li>
                <li>
                    <a onmouseover="menuPedidos()">Pedidos</a>
                    <ul class="submenu">
                        <li><a>Historico de Pedidos</a></li>
                        <li><a>Novo Pedido</a></li>
                        <li><a>Sair</a></li>
                    </ul>
                </li>
                <li><a>Relatorios</a></li>
            </ul>
        </nav>




        <div onclick="loginMenu()" class="conta">
            <p class="ola-nome">Ola, nome</p>
        </div>
    </header>

    <main>

        <form action="">
            <div class="container1">

                <h1>Formulario com Informações do pedido</h1>

                <h2>Dados do cliente</h2>
                <div class="D-client1">

                    <div class="campo1">
                        <label for=""><strong>Nome</strong></label>
                        <input type="text" name="" id="" required placeholder="Digite seu nome">

                    </div>

                    <div class="campo1">
                        <label for="data-pedido"><strong> Data do Pedido</strong></label>
                        <input type="date" name="data-pedido" id="data-pedido" required placeholder="Digite seu nome">

                    </div>
                </div>

                <div class="D-client2">

                    <div class="campo2">
                        <label for=""><strong>Contato:</strong></label>
                        <input type="tel" name="" id="" required placeholder="(11) 99999-9999">
                    </div>

                    <div class="campo2">
                        <label for=""><strong>Emai:</strong></label>
                        <input type="email" name="" id="" required placeholder="exemplo@dominio.com">
                    </div>
                </div>


                <h2>Detalhes Logísticos e Prioridades</h2>

                <div class="D-logistic">

                    <div class="campo3">
                        <label for="data-entrega"><strong>Prazo de Entrega:</strong></label>
                        <input type="date" name="data-entrega" id="data-entrega">
                    </div>



                    <div class="container-prioridade">

                        <div class="campo4">
                            <p for=""><strong>Prioridade:</strong></p>
                        </div>

                        <div class="box-checkbox">
                            <div class="niveis">
                                <label for=""><strong>Baixa</strong></label>
                                <input type="checkbox" name="" id="">


                                <label for=""><strong>Média</strong></label>
                                <input type="checkbox" name="" id="">

                                <label for=""><Strong>Alta</Strong></label>
                                <input type="checkbox" name="" id="">
                            </div>
                        </div>
                    </div>
                </div>

                <h2>Informações de Personalização</h2>










            </div>











            </div>
        </form>



    </main>
</body>

</html>
