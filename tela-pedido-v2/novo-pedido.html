        <div class="container03">
            <h3>3. Upload da Imagem</h3>

            <div class="upload-img">

                <p class="upload-texto-principal">
                    <strong>Arraste sua arte aqui</strong> <a href="">ou clique para enviar</a>
                </p>
                <p class="upload-legendas">Formatos aceitos: PNG, AI e PDF.</p>
            </div>

            <p class="move">Quantidade e Tamanho:</p>

            <div class="seletor-tamanhos">

                <div class="opcoes-tamanhos">

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho[]" id="p" value="p">
                        <label for="p">P</label>
                        <input type="number" name="qtd-p" class="input-qtd" min="0" value="0">
                    </div>

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho[]" id="m" value="m">
                        <label for="m">M</label>
                        <input type="number" name="qtd-m" class="input-qtd" min="0" value="0">
                    </div>

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho[]" id="g" value="g">
                        <label for="g">G</label>
                        <input type="number" name="qtd-g" class="input-qtd" min="0" value="0">
                    </div>

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho[]" id="gg" value="gg">
                        <label for="gg">GG</label>
                        <input type="number" name="qtd-gg" class="input-qtd" min="0" value="0">
                    </div>

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho[]" id="g1" value="g1">
                        <label for="g1">G1</label>
                        <input type="number" name="qtd-g1" class="input-qtd" min="0" value="0">
                    </div>

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho" id="g2" value="g2">
                        <label for="g2">G2</label>
                        <input type="number" name="qtd-g2" class="input-qtd" min="0" value="0">
                    </div>

                    <div class="tamanho-grupo">
                        <input type="checkbox" name="tamanho" id="g3" value="g3">
                        <label for="g3">G3</label>
                        <input type="number" name="qtd-g3" class="input-qtd" min="0" value="0">
                    </div>
                </div>

            </div>
          

            <div class="botoes">

                <button class="open" id="botao-voltar-form">
                    <b>Voltar</b>
                </button>

                <button class="next" id="botao-continuar-modal">
