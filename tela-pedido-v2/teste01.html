<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#0a0a2a, #1a1a4a);
    }

    .container {
      background: #eee;
      margin: 40px auto;
      padding: 20px;
      width: 90%;
      max-width: 1100px;
      border-radius: 12px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* CARD */
    .card {
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      border-color: #00c853;
    }

    /* IMAGEM */
    .card img {
      width: 80px;
      margin-bottom: 10px;
    }

    /* TITULO */
    .card h3 {
      margin-bottom: 10px;
    }

    /* SELECT */
    .card select {
      width: 100%;
      margin: 5px 0;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
  table {
    border-collapse: collapse;
    width: 50%;
  }

  th, td {
    border: 1px solid black;
    padding: 8px;
    text-align: left;
  }

  th {
    background-color: #f2f2f2;
  }
</style>
  </style>
</head>
