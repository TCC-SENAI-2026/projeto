<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema E-Threads - Seleção</title>
    <style>
        /* --- Cores e Variáveis --- */
        :root {
            --azul-primario: #001f3f;
            --azul-claro: #007bff;
            --verde-sucesso: #2ecc71;
            --branco-gelo: #f8f9fa;
            --sombra: 0 10px 20px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            gap: 20px; /* Espaço entre as caixas */
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #001f3f 0%, #00001a 100%);
            margin: 0;
        }

        /* 1. O Container - Aqui acontece o "Aumentar" */
        .cartao-container {
            width: 250px;
            height: 350px;
            perspective: 1000px;
            transition: transform 0.3s ease; /* Transição suave para o zoom */
        }

        /* Efeito de aumentar quando passa o mouse */
        .cartao-container:hover {
            transform: scale(1.08); /* Aumenta 8% do tamanho original */
            z-index: 10; /* Garante que ela fique na frente das outras ao aumentar */
        }

        /* 2. O Corpo que gira */
        .cartao-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .cartao-inner.selecionado {
            transform: rotateY(180deg);
        }

        /* 3. Estilo das Faces */
        .face-frente, .face-verso {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: var(--sombra);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Face da Frente - Estilo Limpo */
        .face-frente {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            color: var(--azul-primario);
        }

        .img-produto {
            width: 130px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            margin-bottom: 15px;
        }

        .btn-selecionar {
            padding: 12px 25px;
            border-radius: 50px;
            border: 2px solid var(--azul-claro);
            background: transparent;
            color: var(--azul-claro);
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-selecionar:hover {
            background: var(--azul-claro);
            color: white;
        }

        /* Face do Verso - Estilo Sucesso */
        .face-verso {
            background: linear-gradient(145deg, #27ae60, #2ecc71);
            color: white;
            transform: rotateY(180deg);
        }

        .icon-check {
            font-size: 90px;
            margin-bottom: 10px;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="cartao-container">
        <div class="cartao-inner">
            <div class="face-frente">
                <img src="https://cdn-icons-png.flaticon.com/512/2503/2503380.png" class="img-produto">
                <h3>Camiseta</h3>
                <button class="btn-selecionar">Selecionar</button>
            </div>
            <div class="face-verso">
                <div class="icon-check">✓</div>
                <strong>SELECIONADO</strong>
                <p>Tamanho: M | Cor: Azul</p>
                <button class="btn-voltar">Desmarcar</button>
            </div>
        </div>
    </div>

    <div class="cartao-container">
        <div class="cartao-inner">
            <div class="face-frente">
                <img src="https://cdn-icons-png.flaticon.com/512/3124/3124373.png" class="img-produto">
                <h3>Calça Jeans</h3>
                <button class="btn-selecionar">Selecionar</button>
            </div>
            <div class="face-verso">
                <div class="icon-check">✓</div>
                <strong>SELECIONADO</strong>
                <p>Tamanho: 42 | Cor: Preta</p>
                <button class="btn-voltar">Desmarcar</button>
            </div>
        </div>
    </div>

    <script>
      // 1. Pegamos todos os botões de "Selecionar" e de "Voltar"
const botoesGirar = document.querySelectorAll('.btn-selecionar, .btn-voltar');

// 2. Para cada um desses botões...
botoesGirar.forEach(function(botao) {
    
    // 3. Adicionamos o evento de clique
    botao.addEventListener('click', function(event) {
        
        // Lembra do preventDefault? 
        // Aqui ele garante que o botão não tente "enviar" nada, apenas execute o JS.
        event.preventDefault();

        // 4. A MÁGICA: O comando .closest('.cartao-inner') 
        // Ele funciona como um GPS: "A partir deste botão, suba no HTML até encontrar 
        // o elemento pai que tenha a classe .cartao-inner".
        const cartaoParaGirar = botao.closest('.cartao-inner');

        // 5. Agora sim, giramos apenas o cartão que é "dono" desse botão
        cartaoParaGirar.classList.toggle('selecionado');
        
        // Pequeno truque: usamos stopPropagation para o clique 
        // não "vazar" para outros elementos.
        event.stopPropagation();
    });
    
});
    </script>

</body>
</html>
